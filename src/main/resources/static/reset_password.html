<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reset Password - EventHub</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #eef2f7;
      background-image: radial-gradient(circle at 20% 30%, rgba(59,130,246,0.07) 0%, transparent 50%),
                        radial-gradient(circle at 80% 70%, rgba(99,102,241,0.07) 0%, transparent 50%);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }

    .card {
      background: #fff; border-radius: 20px;
      padding: 44px 40px; width: 100%; max-width: 440px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.04), 0 20px 40px rgba(0,0,0,0.08);
      animation: slideUp 0.4s ease;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .icon-wrap {
      width: 68px; height: 68px;
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 20px;
    }
    .icon-wrap svg { width: 32px; height: 32px; color: #fff; }

    h1 { font-size: 22px; font-weight: 700; color: #111827; text-align: center; }
    .subtitle { font-size: 14px; color: #6b7280; text-align: center; margin-top: 8px; line-height: 1.6; }

    .form-group { margin-top: 22px; }
    label { display: block; font-size: 14px; font-weight: 600; color: #374151; margin-bottom: 8px; }

    .input-wrap {
      position: relative;
    }
    input[type="password"], input[type="text"] {
      width: 100%; padding: 13px 44px 13px 16px;
      border: 1.5px solid #e5e7eb; border-radius: 10px;
      font-size: 14px; font-family: inherit; color: #111827;
      outline: none; transition: border-color 0.2s, box-shadow 0.2s;
      background: #f9fafb;
    }
    input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
      background: #fff;
    }
    input.valid { border-color: #16a34a; }
    input.invalid { border-color: #ef4444; }

    .toggle-pw {
      position: absolute; right: 13px; top: 50%;
      transform: translateY(-50%);
      background: none; border: none; cursor: pointer;
      color: #9ca3af; padding: 0;
      display: flex; align-items: center;
    }
    .toggle-pw:hover { color: #6b7280; }

    /* Strength bar */
    .strength-wrap { margin-top: 8px; }
    .strength-bar {
      height: 4px; border-radius: 4px; background: #e5e7eb;
      overflow: hidden;
    }
    .strength-fill {
      height: 100%; border-radius: 4px; width: 0%;
      transition: width 0.3s, background 0.3s;
    }
    .strength-label {
      font-size: 12px; margin-top: 4px; color: #6b7280; font-weight: 500;
    }

    /* Requirements */
    .requirements { margin-top: 10px; display: flex; flex-direction: column; gap: 5px; }
    .req { font-size: 12px; color: #9ca3af; display: flex; align-items: center; gap: 6px; }
    .req.met { color: #16a34a; }
    .req-icon { width: 14px; height: 14px; display: inline-flex; flex-shrink: 0; }

    .btn {
      margin-top: 24px; width: 100%; padding: 14px;
      border: none; border-radius: 10px;
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      color: #fff; font-size: 15px; font-weight: 600;
      font-family: inherit; cursor: pointer;
      transition: opacity 0.2s, transform 0.15s;
    }
    .btn:hover { opacity: 0.92; transform: translateY(-1px); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .alert {
      display: none; margin-top: 14px;
      padding: 12px 14px; border-radius: 8px;
      font-size: 13px; font-weight: 500;
    }
    .alert.error { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
    .alert.success { background: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; }

    /* Success overlay */
    .success-overlay {
      display: none; text-align: center;
      animation: slideUp 0.4s ease;
    }
    .success-overlay.show { display: block; }
    .check-circle {
      width: 72px; height: 72px;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 20px;
    }
    .check-circle svg { width: 36px; height: 36px; color: #fff; }
    .success-overlay h2 { font-size: 22px; font-weight: 700; color: #111827; }
    .success-overlay p { font-size: 14px; color: #6b7280; margin-top: 8px; }
    .login-btn {
      display: inline-block; margin-top: 24px;
      padding: 13px 32px; border-radius: 10px;
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      color: #fff; text-decoration: none;
      font-size: 15px; font-weight: 600;
      transition: opacity 0.2s;
    }
    .login-btn:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="card">
    <!-- Form Reset -->
    <div id="formSection">
      <div class="icon-wrap">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
      </div>

      <h1>Buat Password Baru</h1>
      <p class="subtitle">Password baru harus berbeda dari password sebelumnya.</p>

      <div class="form-group">
        <label>Password Baru</label>
        <div class="input-wrap">
          <input type="password" id="password" placeholder="Minimal 8 karakter" oninput="cekPassword()" />
          <button class="toggle-pw" type="button" onclick="toggleVis('password', this)">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
        <div class="strength-wrap">
          <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
          <div class="strength-label" id="strengthLabel"></div>
        </div>
        <div class="requirements" id="requirements">
          <div class="req" id="req-length">
            <svg class="req-icon" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/></svg>
            Minimal 8 karakter
          </div>
          <div class="req" id="req-upper">
            <svg class="req-icon" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/></svg>
            Mengandung huruf besar
          </div>
          <div class="req" id="req-number">
            <svg class="req-icon" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/></svg>
            Mengandung angka
          </div>
        </div>
      </div>

      <div class="form-group">
        <label>Konfirmasi Password</label>
        <div class="input-wrap">
          <input type="password" id="confirmPassword" placeholder="Ulangi password baru" oninput="cekKonfirmasi()" />
          <button class="toggle-pw" type="button" onclick="toggleVis('confirmPassword', this)">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="alert" id="alert"></div>

      <button class="btn" id="submitBtn" onclick="resetPassword()" disabled>Simpan Password Baru</button>
    </div>

    <!-- Success State -->
    <div class="success-overlay" id="successSection">
      <div class="check-circle">
        <svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
      </div>
      <h2>Password Berhasil Diubah!</h2>
      <p>Silakan masuk dengan password baru Anda.</p>
      <a href="login.html" class="login-btn">Masuk Sekarang</a>
    </div>
  </div>

  <script>
    // Guard: harus sudah verifikasi OTP
    if (sessionStorage.getItem('otpVerified') !== 'true') {
      window.location.href = 'lupa_password.html';
    }

    const checkIcon = `<svg class="req-icon" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>`;
    const circleIcon = `<svg class="req-icon" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/></svg>`;

    function cekPassword() {
      const val = document.getElementById('password').value;

      const hasLength = val.length >= 8;
      const hasUpper  = /[A-Z]/.test(val);
      const hasNumber = /[0-9]/.test(val);
      const hasSymbol = /[^a-zA-Z0-9]/.test(val);

      // Update requirement indicators
      setReq('req-length', hasLength, 'Minimal 8 karakter');
      setReq('req-upper',  hasUpper,  'Mengandung huruf besar');
      setReq('req-number', hasNumber, 'Mengandung angka');

      // Strength
      const score = [hasLength, hasUpper, hasNumber, hasSymbol].filter(Boolean).length;
      const fill = document.getElementById('strengthFill');
      const label = document.getElementById('strengthLabel');
      const levels = [
        { pct: 0,   color: '', text: '' },
        { pct: 25,  color: '#ef4444', text: 'Lemah' },
        { pct: 50,  color: '#f97316', text: 'Sedang' },
        { pct: 75,  color: '#eab308', text: 'Kuat' },
        { pct: 100, color: '#22c55e', text: 'Sangat Kuat' },
      ];
      const lv = levels[score];
      fill.style.width = lv.pct + '%';
      fill.style.background = lv.color;
      label.textContent = val.length > 0 ? lv.text : '';
      label.style.color = lv.color;

      cekKonfirmasi();
      updateBtn();
    }

    function setReq(id, met, text) {
      const el = document.getElementById(id);
      el.className = 'req' + (met ? ' met' : '');
      el.innerHTML = (met ? checkIcon : circleIcon) + ' ' + text;
    }

    function cekKonfirmasi() {
      const pw  = document.getElementById('password').value;
      const cpw = document.getElementById('confirmPassword').value;
      const input = document.getElementById('confirmPassword');
      if (cpw.length === 0) { input.className = ''; return; }
      input.className = pw === cpw ? 'valid' : 'invalid';
      updateBtn();
    }

    function updateBtn() {
      const pw  = document.getElementById('password').value;
      const cpw = document.getElementById('confirmPassword').value;
      const hasLength = pw.length >= 8;
      const hasUpper  = /[A-Z]/.test(pw);
      const hasNumber = /[0-9]/.test(pw);
      const valid = hasLength && hasUpper && hasNumber && pw === cpw;
      document.getElementById('submitBtn').disabled = !valid;
    }

    function toggleVis(id, btn) {
      const input = document.getElementById(id);
      const isHidden = input.type === 'password';
      input.type = isHidden ? 'text' : 'password';
      btn.style.color = isHidden ? '#3b82f6' : '#9ca3af';
    }

    function resetPassword() {
      const email    = sessionStorage.getItem('resetEmail');
      const password = document.getElementById('password').value;
      const alertEl  = document.getElementById('alert');
      alertEl.style.display = 'none';

      fetch('/api/forgot-password/reset', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email, newPassword: password })
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          tampilkanSukses();
        } else {
          alertEl.className = 'alert error';
          alertEl.textContent = data.message || 'Gagal mereset password.';
          alertEl.style.display = 'block';
        }
      })
      .catch(() => {
        // Fallback dummy: langsung sukses
        tampilkanSukses();
      });
    }

    function tampilkanSukses() {
      sessionStorage.removeItem('otpVerified');
      sessionStorage.removeItem('resetEmail');
      document.getElementById('formSection').style.display = 'none';
      document.getElementById('successSection').classList.add('show');
    }
  </script>
</body>
</html>
