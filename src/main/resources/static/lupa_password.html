<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lupa Password - EventHub</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #eef2f7;
      background-image: radial-gradient(circle at 20% 30%, rgba(59,130,246,0.07) 0%, transparent 50%),
                        radial-gradient(circle at 80% 70%, rgba(99,102,241,0.07) 0%, transparent 50%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: #fff;
      border-radius: 20px;
      padding: 44px 40px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.04), 0 20px 40px rgba(0,0,0,0.08);
      animation: slideUp 0.4s ease;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .icon-wrap {
      width: 68px; height: 68px;
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 20px;
    }
    .icon-wrap svg { width: 32px; height: 32px; color: #fff; }

    h1 { font-size: 22px; font-weight: 700; color: #111827; text-align: center; }
    .subtitle { font-size: 14px; color: #6b7280; text-align: center; margin-top: 8px; line-height: 1.6; }

    .form-group { margin-top: 28px; }
    label { display: block; font-size: 14px; font-weight: 600; color: #374151; margin-bottom: 8px; }

    input[type="email"] {
      width: 100%; padding: 13px 16px;
      border: 1.5px solid #e5e7eb; border-radius: 10px;
      font-size: 14px; font-family: inherit; color: #111827;
      outline: none; transition: border-color 0.2s, box-shadow 0.2s;
      background: #f9fafb;
    }
    input[type="email"]:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
      background: #fff;
    }
    input[type="email"]::placeholder { color: #9ca3af; }

    .btn {
      margin-top: 22px; width: 100%;
      padding: 14px; border: none; border-radius: 10px;
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      color: #fff; font-size: 15px; font-weight: 600;
      font-family: inherit; cursor: pointer;
      transition: opacity 0.2s, transform 0.15s;
    }
    .btn:hover { opacity: 0.92; transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }

    .back-link {
      text-align: center; margin-top: 20px;
      font-size: 14px; color: #6b7280;
    }
    .back-link a { color: #3b82f6; font-weight: 600; text-decoration: none; }
    .back-link a:hover { text-decoration: underline; }

    .alert {
      display: none; margin-top: 16px;
      padding: 12px 14px; border-radius: 8px;
      font-size: 13px; font-weight: 500;
    }
    .alert.error { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
    .alert.success { background: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrap">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
    </div>

    <h1>Lupa Password?</h1>
    <p class="subtitle">Masukkan email terdaftar Anda. Kami akan mengirimkan kode OTP untuk verifikasi.</p>

    <div class="form-group">
      <label for="email">Alamat Email</label>
      <input type="email" id="email" placeholder="nama@email.com" />
    </div>

    <div class="alert" id="alert"></div>

    <button class="btn" onclick="kirimOTP()">Kirim Kode OTP</button>

    <p class="back-link">
      Ingat password? <a href="login.html">Kembali masuk</a>
    </p>
  </div>

  <script>
    function kirimOTP() {
      const email = document.getElementById('email').value.trim();
      const alert = document.getElementById('alert');

      alert.style.display = 'none';

      if (!email) {
        alert.className = 'alert error';
        alert.textContent = 'Email tidak boleh kosong.';
        alert.style.display = 'block';
        return;
      }

      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRegex.test(email)) {
        alert.className = 'alert error';
        alert.textContent = 'Format email tidak valid.';
        alert.style.display = 'block';
        return;
      }

      // Panggil endpoint backend
      fetch('/api/forgot-password/request', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email })
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          sessionStorage.setItem('resetEmail', email);
          window.location.href = 'verifikasi_otp.html';
        } else {
          alert.className = 'alert error';
          alert.textContent = data.message || 'Email tidak ditemukan.';
          alert.style.display = 'block';
        }
      })
      .catch(() => {
        // fallback untuk testing tanpa backend
        sessionStorage.setItem('resetEmail', email);
        window.location.href = 'verifikasi_otp.html';
      });
    }

    document.getElementById('email').addEventListener('keydown', e => {
      if (e.key === 'Enter') kirimOTP();
    });
  </script>
</body>
</html>
